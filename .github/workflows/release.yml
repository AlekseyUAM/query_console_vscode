name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # требуется для создания Release и загрузки asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package VSIX
        run: npx @vscode/vsce package --out query-console-1c-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: query-console-1c-*.vsix
          generate_release_notes: true
